name: Deploy production

# Push to main -> check + test -> build bundle -> publish to the "preview-latest" release.
# The VM (deploy/vm/modernite-autodeploy.sh) installs it within ~1 minute; this job waits until
# https://modernite.wenda.global/build.json reports the new commit.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SITE_URL: https://modernite.wenda.global
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Build bundle
        run: bash scripts/build-deploy-bundle.sh "$RUNNER_TEMP/bundle"

      - name: Publish bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view preview-latest >/dev/null 2>&1 || \
            gh release create preview-latest --prerelease --target "$GITHUB_SHA" \
              --title "Production bundle (auto)" \
              --notes "Rolling bundle installed by the production VM. Updated on every push to main; do not edit."
          gh release upload preview-latest "$RUNNER_TEMP/bundle/modernite-deploy.tgz" --clobber
          gh release upload preview-latest "$RUNNER_TEMP/bundle/manifest.txt" --clobber

      - name: Wait for the live site
        run: |
          for i in $(seq 60); do
            live="$(curl -fsS "$SITE_URL/build.json?t=$(date +%s)" | jq -r .commit 2>/dev/null || true)"
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Live: $SITE_URL is running $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$SITE_URL did not pick up $GITHUB_SHA within 10 minutes (live: ${live:-unknown}). Check 'journalctl -u modernite-autodeploy' on the VM."
          exit 1
