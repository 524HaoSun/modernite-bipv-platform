<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Modernite BIPV coverage compass">
  <defs>
    <radialGradient id="faceGlow" cx="47%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="56%" stop-color="#f7fbf6"/>
      <stop offset="100%" stop-color="#e2f0e8"/>
    </radialGradient>
    <radialGradient id="outerGlow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="62%" stop-color="#d8eadf" stop-opacity=".56"/>
      <stop offset="100%" stop-color="#d8eadf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glassRim" cx="48%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".96"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity=".4"/>
      <stop offset="82%" stop-color="#b9d6c7" stop-opacity=".23"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".76"/>
    </radialGradient>
    <linearGradient id="greenArc" x1="93" y1="300" x2="548" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d3ecdf"/>
      <stop offset="18%" stop-color="#a6d4bd"/>
      <stop offset="54%" stop-color="#4a9976"/>
      <stop offset="100%" stop-color="#08704f"/>
    </linearGradient>
    <linearGradient id="goldArc" x1="150" y1="460" x2="500" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#efd786"/>
      <stop offset="54%" stop-color="#c6971f"/>
      <stop offset="100%" stop-color="#f6e8ae"/>
    </linearGradient>
    <linearGradient id="needleGold" x1="243" y1="252" x2="395" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c99a22"/>
      <stop offset="56%" stop-color="#d5aa39"/>
      <stop offset="100%" stop-color="#b88812"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#174b3e" flood-opacity=".16"/>
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#ffffff" flood-opacity=".9"/>
    </filter>
    <filter id="needleShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#8f6814" flood-opacity=".28"/>
    </filter>
    <style>
      .scale{font-family:Inter,Arial,sans-serif;font-size:20px;fill:#164e42;font-weight:500}
      .brand{font-family:Inter,Arial,sans-serif;font-size:20px;letter-spacing:12px;fill:#0b493d;font-weight:700}
      .sub{font-family:Inter,Arial,sans-serif;font-size:13px;letter-spacing:9px;fill:#b2861e;font-weight:700}
      .label{font-family:Inter,Arial,sans-serif;font-size:16px;letter-spacing:8px;fill:#0f463b;font-weight:700}
    </style>
  </defs>

  <circle cx="320" cy="320" r="314" fill="url(#outerGlow)"/>
  <circle cx="320" cy="320" r="302" fill="none" stroke="#f2e4b0" stroke-width="1" opacity=".7"/>
  <circle cx="320" cy="320" r="292" fill="none" stroke="#d6b54f" stroke-width="1.25" opacity=".54"/>
  <circle cx="320" cy="320" r="282" fill="none" stroke="#ffffff" stroke-width="7" opacity=".9"/>
  <circle cx="320" cy="320" r="270" fill="none" stroke="#dcebe2" stroke-width="1" opacity=".9"/>
  <circle cx="320" cy="320" r="258" fill="none" stroke="#8fb5a4" stroke-width=".9" stroke-dasharray="1.5 10" opacity=".42"/>
  <circle cx="320" cy="320" r="239" fill="url(#glassRim)" opacity=".9"/>
  <circle cx="320" cy="320" r="233" fill="none" stroke="#ffffff" stroke-width="19" opacity=".88"/>
  <circle cx="320" cy="320" r="212" fill="none" stroke="#b5d0c1" stroke-width="1.3" opacity=".64"/>
  <circle cx="320" cy="320" r="198" fill="url(#faceGlow)" filter="url(#softShadow)"/>
  <circle cx="320" cy="320" r="184" fill="none" stroke="#d8eadf" stroke-width="1" opacity=".82"/>
  <circle cx="320" cy="320" r="171" fill="none" stroke="#2d6c57" stroke-width="9" stroke-dasharray=".7 11.2" opacity=".18"/>
  <circle cx="320" cy="320" r="154" fill="none" stroke="#f6f9f5" stroke-width="34" opacity=".5"/>

  <path d="M153 449 A214 214 0 0 1 189 171" fill="none" stroke="url(#goldArc)" stroke-width="11" stroke-linecap="round" opacity=".76"/>
  <path d="M492 449 A214 214 0 1 0 148 449" fill="none" stroke="url(#greenArc)" stroke-width="38" stroke-linecap="round" opacity=".94"/>
  <path d="M492 449 A214 214 0 1 0 148 449" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".28"/>
  <path d="M252 529 A220 220 0 0 0 407 529" fill="none" stroke="url(#goldArc)" stroke-width="12" stroke-linecap="round" opacity=".72"/>
  <g opacity=".42" stroke="#174b3e" stroke-width=".95">
    <line x1="320" y1="38" x2="320" y2="84"/>
    <line x1="320" y1="556" x2="320" y2="602"/>
    <line x1="38" y1="320" x2="84" y2="320"/>
    <line x1="556" y1="320" x2="602" y2="320"/>
  </g>
  <g opacity=".18" stroke="#0b493d" stroke-width=".7">
    <line x1="118" y1="118" x2="154" y2="154"/>
    <line x1="486" y1="486" x2="522" y2="522"/>
    <line x1="522" y1="118" x2="486" y2="154"/>
    <line x1="154" y1="486" x2="118" y2="522"/>
  </g>

  <text class="scale" x="310" y="78">100%</text>
  <text class="scale" x="63" y="327">25%</text>
  <text class="scale" x="538" y="327">75%</text>
  <text class="scale" x="309" y="586">0%</text>

  <g transform="translate(320 244)" stroke="#c29121" stroke-width="2" stroke-linecap="round" fill="none">
    <circle r="10" fill="none"/>
    <line x1="0" y1="-21" x2="0" y2="-31"/>
    <line x1="0" y1="21" x2="0" y2="31"/>
    <line x1="-21" y1="0" x2="-31" y2="0"/>
    <line x1="21" y1="0" x2="31" y2="0"/>
    <line x1="-15" y1="-15" x2="-23" y2="-23"/>
    <line x1="15" y1="-15" x2="23" y2="-23"/>
    <line x1="-15" y1="15" x2="-23" y2="23"/>
    <line x1="15" y1="15" x2="23" y2="23"/>
  </g>

</svg>
